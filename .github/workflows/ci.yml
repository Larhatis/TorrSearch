name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (exact versions from requirements.lock)
        run: pip install -c requirements.lock -e ".[dev]"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - name: Lock up to date with pyproject.toml
        # uv keeps the pins already in the copied file, so this only differs when
        # pyproject.toml changed without regenerating the lock.
        run: |
          cp requirements.lock "$RUNNER_TEMP/check.lock"
          uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 \
            -o "$RUNNER_TEMP/check.lock" --quiet
          if ! diff <(grep -v '^#' requirements.lock) <(grep -v '^#' "$RUNNER_TEMP/check.lock"); then
            echo "::error::requirements.lock n'est plus a jour : relancer 'uv pip compile pyproject.toml --extra dev --universal --python-version 3.12 -o requirements.lock'"
            exit 1
          fi
      - name: Lint (ruff)
        run: ruff check torsearch tests
      - name: Type check (mypy)
        run: mypy
      - name: Tests
        run: pytest

  docker:
    # Builds and starts the real image on every push/PR, so a dependency that breaks the
    # startup shows up here instead of on the server after a release (amd64 only: arm64
    # emulation stays in the release workflow).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t torsearch:ci .
      - name: Start and wait for /healthz
        run: |
          docker run -d --name ts -e TORSEARCH_DB=/data/torsearch.db -p 8000:8000 torsearch:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then
              echo; echo "Image demarree"; exit 0
            fi
            sleep 2
          done
          echo "::error::l'image ne repond pas sur /healthz apres 60 s"
          docker logs ts
          exit 1
