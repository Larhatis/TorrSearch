<form hx-post="/settings/indexers/{{ ix.name }}" hx-target="#indexer-list" hx-swap="outerHTML"
      class="flex flex-col sm:flex-row sm:flex-wrap sm:items-end gap-2 border-b border-slate-800 py-3">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2 flex-1">
    <label class="text-xs text-slate-400">Nom<br>
      <input name="name" value="{{ ix.name }}" class="w-full rounded bg-slate-800 border border-slate-700 px-2 py-1"></label>
    <label class="text-xs text-slate-400 sm:col-span-2">URL<br>
      <input name="url" value="{{ ix.url }}" class="w-full rounded bg-slate-800 border border-slate-700 px-2 py-1"></label>
    <label class="text-xs text-slate-400">Cle API Torznab<br>
      <input name="api_key" type="password" value="" autocomplete="new-password"
             placeholder="{{ '•••••• (inchange si vide)' if ix.api_key else '' }}"
             class="w-full rounded bg-slate-800 border border-slate-700 px-2 py-1"></label>
    <input type="hidden" name="original_name" value="{{ ix.name }}">
    <label class="text-xs text-slate-400">Auth<br>
      <select name="auth" class="w-full rounded bg-slate-800 border border-slate-700 px-2 py-1">
        <option value="query" {% if ix.auth.value == 'query' %}selected{% endif %}>query</option>
        <option value="bearer" {% if ix.auth.value == 'bearer' %}selected{% endif %}>bearer</option>
      </select></label>
  </div>
  <div class="flex flex-wrap items-center gap-1.5 pt-1 sm:pt-0">
    <button class="rounded bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1 text-xs font-semibold text-white">Enregistrer</button>
    <button type="button" hx-post="/settings/indexers/{{ ix.name }}/toggle" hx-target="#indexer-list" hx-swap="outerHTML"
            class="rounded {% if ix.enabled %}bg-amber-600 hover:bg-amber-500{% else %}bg-slate-600 hover:bg-slate-500{% endif %} px-2.5 py-1 text-xs text-white">
      {{ "Desactiver" if ix.enabled else "Activer" }}</button>
    <button type="button" hx-post="/settings/indexer-test" hx-include="closest form" hx-target="#toast"
            class="rounded bg-slate-700 hover:bg-slate-600 px-2.5 py-1 text-xs text-slate-200">Tester</button>
    <button type="button" hx-post="/settings/indexers/{{ ix.name }}/delete" hx-target="#indexer-list" hx-swap="outerHTML"
            class="rounded bg-red-700 hover:bg-red-600 px-2.5 py-1 text-xs text-white">Supprimer</button>
  </div>
</form>
